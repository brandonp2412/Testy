name: Chromium study consistency

on:
  push:
    paths:
      - 'study.py'
      - 'tests/test_study.py'
      - 'data/raw/**'
      - 'data/processed/**'
      - 'charts/**'
      - 'RESULTS.md'
      - 'requirements.txt'
      - '.github/workflows/chromium-study.yml'
  pull_request:
    paths:
      - 'study.py'
      - 'tests/test_study.py'
      - 'data/raw/**'
      - 'data/processed/**'
      - 'charts/**'
      - 'RESULTS.md'
      - 'requirements.txt'
      - '.github/workflows/chromium-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python study.py analyze
      - run: python study.py charts
      - name: Verify committed generated artifacts are current
        run: test -z "$(git status --porcelain)"
