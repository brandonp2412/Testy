name: Publish Firefox study outputs

on:
  push:
    paths:
      - '.github/workflows/firefox-publish.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firefox-study-output
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33244477624
      - name: Commit generated Firefox study
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FIREFOX_RESULTS.md data/firefox charts/firefox
          git commit -m 'Publish Firefox coverage vs CVE study'
          git push
