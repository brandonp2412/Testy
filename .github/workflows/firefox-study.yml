name: Firefox study

on:
  workflow_dispatch:
  push:
    paths:
      - 'firefox_study.py'
      - 'firefox_quality_study.py'
      - 'tests/test_firefox_quality_study.py'
      - 'requirements.txt'
      - '.github/workflows/firefox-study.yml'

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python firefox_quality_study.py all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firefox-study-output
          retention-days: 14
          path: |
            data/firefox
            charts/firefox
            FIREFOX_RESULTS.md
